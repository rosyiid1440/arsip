{% for asset in assets %}
<div 
    hx-get="/assets/{{ asset.id }}/details" 
    hx-target="#modal-container" 
    hx-swap="innerHTML"
    class="cursor-pointer bg-white rounded-lg shadow-md overflow-hidden transform hover:scale-105 transition-transform duration-300">

    {% if asset.thumbnail_path %}
        <img src="/static/{{ asset.thumbnail_path }}" alt="{{ asset.title }}" class="w-full h-40 object-cover">
    {% else %}
        <div class="w-full h-40 bg-gray-200 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
            </svg>
        </div>
    {% endif %}
    
    <div class="p-2">
        <h3 class="text-sm font-semibold truncate">{{ asset.title }}</h3>
        <p class="text-xs text-gray-500">{{ asset.event_name or 'Tanpa Acara' }}</p>
    </div>
</div>
{% endfor %}
