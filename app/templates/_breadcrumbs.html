<nav id="breadcrumbs-nav" hx-swap-oob="true" class="text-sm font-semibold" aria-label="Breadcrumb">
    <ol class="list-none p-0 inline-flex items-center">
        <li class="flex items-center">
            <a href="#" hx-get="/browse/root" hx-target="#browser-content"
               class="text-gray-500 hover:text-blue-600">Home</a>
        </li>

        {% for folder in path %}
        <li class="flex items-center">
            <span class="mx-2 text-gray-400">/</span>
            <a href="#" hx-get="/browse/{{ folder.id }}" hx-target="#browser-content"
               class="text-gray-500 hover:text-blue-600">{{ folder.name }}</a>
        </li>
        {% endfor %}
    </ol>
</nav>
