<div id="modal-wrapper" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <form hx-post="/upload-asset" hx-encoding="multipart/form-data" hx-target="#browser-content" hx-swap="innerHTML"
          class="bg-white p-6 rounded-lg shadow-xl w-full max-w-lg">
        <h3 class="text-xl font-bold mb-4">Unggah Aset Baru</h3>
        <div class="space-y-4">
            <input name="title" required placeholder="Judul Aset*" class="w-full p-2 border rounded">
            <input type="hidden" name="folder_id" value="{{ folder_id if folder_id is not none else '' }}">
            <div>
                <label class="block mb-1 font-semibold">Pilih File:</label>
                <input name="file" type="file" required class="w-full">
            </div>
        </div>
        <div class="flex justify-end space-x-3 mt-6">
            <button type="button" hx-post="/close-modal" hx-target="#modal-container" class="bg-gray-200 px-4 py-2 rounded-lg hover:bg-gray-300">Batal</button>
            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">Unggah</button>
        </div>
    </form>
</div>
