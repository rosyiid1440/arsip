<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip Digital - Browser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50" 
      x-data="{ contextMenu: { visible: false, x: 0, y: 0, item: null } }"
      @click="contextMenu.visible = false"
      @contextmenu.prevent="
        contextMenu.visible = true;
        contextMenu.x = $event.clientX;
        contextMenu.y = $event.clientY;
        contextMenu.item = $event.target.closest('[data-item-id]').dataset;
        htmx.ajax('GET', '/ui/context-menu?item_id=' + contextMenu.item.itemId + '&item_type=' + contextMenu.item.itemType + '&x=' + contextMenu.x + '&y=' + contextMenu.y, '#context-menu-container');
      ">

    <div id="modal-container"></div>

    <div id="context-menu-container"></div>

    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <header class="mb-6 flex justify-between items-center">
            <nav id="breadcrumbs-nav" class="text-sm font-semibold" aria-label="Breadcrumb"></nav>

            <div id="action-buttons-wrapper" class="relative" 
                 x-data="{ open: false }" 
                 @click.outside="open = false">
                
                <button @click="open = !open" class="bg-blue-500 text-white font-semibold px-4 py-2 rounded-lg shadow hover:bg-blue-600 transition-colors flex items-center">
                    <span>+ Baru</span>
                    <svg class="w-4 h-4 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>

                <div x-show="open" x-transition 
                     class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg z-20 origin-top-right">
                    <a href="#" hx-get="/ui/new-folder-form" hx-target="#modal-container" @click="open = false"
                       class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Folder Baru</a>
                    <a href="#" hx-get="/ui/new-upload-form" hx-target="#modal-container" @click="open = false"
                       class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">Upload File</a>
                </div>
            </div>
            </header>

        <main>
            <div id="browser-content" 
                 hx-get="/browse/root" 
                 hx-trigger="load, loadBrowserContent from:body"
                 class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
                <p>Memuat konten...</p>
            </div>
        </main>
    </div>
    <script>
        // Menambahkan 'event listener' pada body untuk 'mendengar' sinyal dari HTMX
        document.body.addEventListener('closeUIElements', function (evt) {
            console.log("Sinyal 'closeUIElements' diterima, membersihkan UI...");

            // Cari wadah modal dan kosongkan isinya
            const modalContainer = document.getElementById('modal-container');
            if (modalContainer) {
                modalContainer.innerHTML = '';
            }

            // Cari wadah menu klik kanan dan kosongkan isinya
            const contextMenuContainer = document.getElementById('context-menu-container');
            if (contextMenuContainer) {
                contextMenuContainer.innerHTML = '';
            }
        });
    </script>
</body>
</html>
